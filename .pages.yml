media:
  input: public/assets/uploads
  output: assets/uploads
  rename: safe
  extensions: [png, jpg, jpeg, webp, gif]

settings:
  hide: true
  content:
    merge: true
  commit:
    identity: user
    templates:
      update: "content: update {path} via CMS"
      create: "content: add {path} via CMS"
      delete: "content: remove {path} via CMS"

content:
  - name: site
    label: GICA Website Content / GICA 網站內容
    type: file
    path: public/content/site.json
    format: json
    fields:
      - name: seo
        label: Search and Sharing / 搜尋與分享資訊
        type: object
        fields:
          - { name: title, label: Website Title / 網站標題, type: string, required: true }
          - { name: description, label: Website Description / 網站摘要, type: text, required: true }
      - name: home
        label: Homepage Hero / 首頁主視覺
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow / 小標, type: string }
          - { name: title, label: Main Heading / 主標題, type: string, required: true }
          - { name: lead, label: Homepage Introduction / 首頁介紹, type: text, required: true }
          - { name: note, label: Supporting Note / 補充短句, type: string }
          - { name: image, label: Hero Image / 主視覺圖片, type: image, required: true }
          - { name: imageAlt, label: Image Alt Text / 圖片替代文字, type: string, required: true, description: Describe the photo for readers using screen readers. / 請描述照片內容，供視障讀者使用。 }
          - name: primaryCta
            label: Primary Button / 主要按鈕
            type: object
            fields:
              - { name: label, label: Button Text / 按鈕文字, type: string }
              - { name: url, label: URL / 網址, type: string }
          - name: secondaryCta
            label: Secondary Button / 次要按鈕
            type: object
            fields:
              - { name: label, label: Button Text / 按鈕文字, type: string }
              - { name: url, label: URL / 網址, type: string }
      - name: about
        label: About GICA / 關於 GICA
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow / 小標, type: string }
          - { name: title, label: Title / 標題, type: string }
          - { name: description, label: Description / 介紹, type: text }
      - name: school
        label: BAHASA Language School / Bahasa 語言學校
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow / 小標, type: string }
          - { name: title, label: Title / 標題, type: string }
          - { name: description, label: Description / 介紹, type: text }
      - name: care
        label: Whole-person Care / 全人關懷
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow / 小標, type: string }
          - { name: title, label: Title / 標題, type: string }
          - { name: description, label: Description / 介紹, type: text }
      - name: featuredStory
        label: Featured Student Story / 精選學員故事
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow / 小標, type: string }
          - { name: title, label: Title / 標題, type: string }
          - { name: quote, label: Quote / 引言, type: text }
          - { name: summary, label: Story Summary / 故事摘要, type: text, description: Use only anonymized content with permission for publication. / 只能放已去識別化且取得公開授權的內容。 }
          - { name: image, label: Image / 圖片, type: image }
          - { name: imageAlt, label: Image Alt Text / 圖片替代文字, type: string }
          - { name: privacyNote, label: Privacy and Consent Note / 隱私與授權註記, type: text }
      - name: news
        label: Activities and News / 最新活動／消息
        type: object
        list:
          collapsible: { collapsed: true, summary: "{title}" }
        fields:
          - { name: title, label: Title / 標題, type: string, required: true }
          - { name: date, label: Date / 日期, type: date, required: true }
          - { name: summary, label: Summary / 摘要, type: text }
          - { name: image, label: Image / 圖片, type: image }
          - { name: url, label: Read More URL / 詳細連結, type: string }
      - name: gallery
        label: Photo Gallery / 照片集
        type: object
        list:
          collapsible: { collapsed: true, summary: "{title}" }
        fields:
          - { name: title, label: Title / 標題, type: string }
          - { name: caption, label: Description / 說明, type: string }
          - { name: image, label: Image / 圖片, type: image, required: true }
          - { name: alt, label: Image Alt Text / 圖片替代文字, type: string, required: true }
      - name: videos
        label: Videos / 影片
        type: object
        list:
          collapsible: { collapsed: true, summary: "{title}" }
        fields:
          - { name: title, label: Title / 標題, type: string, required: true }
          - { name: url, label: YouTube URL / YouTube 網址, type: string, required: true, description: Paste a YouTube URL instead of uploading a large video file. / 請貼 YouTube 網址，不要上傳大型影片檔。 }
          - { name: description, label: Description / 說明, type: text }
      - name: ctas
        label: Action Buttons and Links / 行動按鈕與連結
        type: object
        list:
          collapsible: { collapsed: true, summary: "{label}" }
        fields:
          - { name: audience, label: Audience / 對象, type: string }
          - { name: label, label: Main Text / 主文字, type: string }
          - { name: linkText, label: Link Text / 連結文字, type: string }
          - { name: url, label: URL / 網址, type: string }
      - name: social
        label: Social Links / 社群連結
        type: object
        fields:
          - name: youtube
            label: YouTube
            type: object
            fields:
              - { name: label, label: Display Text / 顯示文字, type: string }
              - { name: url, label: YouTube Channel URL / YouTube 頻道網址, type: string }
          - name: facebook
            label: Facebook
            type: object
            fields:
              - { name: label, label: Display Text / 顯示文字, type: string }
              - { name: url, label: Facebook URL / Facebook 網址, type: string }
      - name: contact
        label: Contact Information / 聯絡資訊
        type: object
        fields:
          - { name: organization, label: Organization Name / 組織名稱, type: string }
          - { name: tagline, label: Organization Tagline / 組織短句, type: text }
          - { name: email, label: Public Email / 公開電子郵件, type: string }
          - { name: websiteLabel, label: Website Link Text / 網站連結文字, type: string }
          - { name: websiteUrl, label: Website URL / 網站網址, type: string }
