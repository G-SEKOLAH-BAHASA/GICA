name: Validate website content

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate managed content
        run: npm test
      - name: Build preview artifact
        run: npm run build
      - name: Upload downloadable preview
        uses: actions/upload-artifact@v4
        with:
          name: gica-website-preview
          path: dist
          retention-days: 14
